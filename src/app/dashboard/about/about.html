<div class="about-editor">

    <div class="page-header">

        <h2>About Section</h2>

        <p>Edit your "Who am I?" section.</p>

    </div>


    <div class="editor-card">

        <h3>Section Title</h3>

        <label>Title</label>

        <input
            type="text"
            placeholder="Who am I?">

    </div>


    <div class="editor-card">

        <h3>About Description</h3>

        <label>Description</label>

        <textarea
            rows="8"
            placeholder="Write your description..."></textarea>

    </div>


    <div class="editor-card">

        <h3>Quote</h3>

        <label>Inspirational Quote</label>

        <textarea
            rows="3"
            placeholder="Write your quote..."></textarea>

    </div>

    <button class="save-btn">

        Save Changes

    </button>

</div>
