<div class="contact-editor">

    <div class="page-header">

        <h2>Contact Section</h2>

        <p>Manage your contact information.</p>

    </div>

    <!-- Section Title -->

    <div class="editor-card">

        <h3>Section Information</h3>

        <label>Section Title</label>

        <input
            type="text"
            placeholder="Contact Me">

    </div>

    <!-- Contact Links -->

    <div class="editor-card">

        <h3>Contact Links</h3>

        <div class="form-grid">

            <div>

                <label>Email</label>

                <input
                    type="email"
                    placeholder="jannah@gmail.com">

            </div>

            <div>

                <label>Phone</label>

                <input
                    type="text"
                    placeholder="+201070995336">

            </div>

            <div>

                <label>GitHub</label>

                <input
                    type="text"
                    placeholder="https://github.com/...">

            </div>

            <div>

                <label>LinkedIn</label>

                <input
                    type="text"
                    placeholder="https://linkedin.com/...">

            </div>

        </div>

    </div>

    <!-- Visibility -->

    <div class="editor-card">

        <h3>Visibility</h3>

        <div class="switch-list">

            <label>

                <input type="checkbox" checked>

                Show Email

            </label>

            <label>

                <input type="checkbox" checked>

                Show Phone

            </label>

            <label>

                <input type="checkbox" checked>

                Show GitHub

            </label>

            <label>

                <input type="checkbox" checked>

                Show LinkedIn

            </label>

        </div>

    </div>


    <button class="save-btn">

        Save Changes

    </button>

</div>
