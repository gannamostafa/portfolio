<div class="skills-editor">

    <div class="page-header">

        <h2>Skills & Technologies</h2>

        <p>Manage your portfolio skills.</p>

    </div>


    <div class="editor-card">

        <h3>Add New Skill</h3>

        <div class="form-grid">

            <div>

                <label>Skill Name</label>

                <input
                    type="text"
                    placeholder="MongoDB">

            </div>

            <div>

                <label>Description</label>

                <input
                    type="text"
                    placeholder="Database Design & Management">

            </div>

        </div>

        <button class="add-btn">

            Add Skill

        </button>

    </div>


    <div class="editor-card">

        <h3>Current Skills</h3>

        <table>

            <thead>

                <tr>

                    <th>Skill</th>

                    <th>Description</th>

                    <th>Action</th>

                </tr>

            </thead>

            <tbody>

                <tr>

                    <td>MongoDB</td>

                    <td>Database Design & Management</td>

                    <td>

                        <button class="edit-btn">

                            Edit

                        </button>

                        <button class="delete-btn">

                            Delete

                        </button>

                    </td>

                </tr>

                <tr>

                    <td>Angular</td>

                    <td>Dynamic User Interfaces</td>

                    <td>

                        <button class="edit-btn">

                            Edit

                        </button>

                        <button class="delete-btn">

                            Delete

                        </button>

                    </td>

                </tr>

            </tbody>

        </table>

    </div>


      <button class="save-btn">

        Save Changes

    </button>

</div>
